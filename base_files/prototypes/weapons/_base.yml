# =============================================================================
# prototypes/weapons/_base.yml
# Weapon prototype chain for Cyberpunk RED TTRPG.
#
# Prototype hierarchy:
#
#   Weapons.Base_Weapon              <- universal root; all weapons inherit from here
#     |- Weapons.Base_Pistol         <- light pistols (1d6)
#     |- Weapons.Base_HeavyPistol    <- heavy pistols (3d6)
#     |- Weapons.Base_VeryHeavyPistol
#     |- Weapons.Base_SMG
#     |- Weapons.Base_HeavySMG
#     |- Weapons.Base_Shotgun
#     |- Weapons.Base_AssaultRifle
#     |- Weapons.Base_SniperRifle
#     |- Weapons.Base_GrenadeLauncher
#     |- Weapons.Base_RocketLauncher
#     |- Weapons.Base_FlamethrowerWeapon
#     |- Weapons.Base_LightMelee
#     |- Weapons.Base_MediumMelee
#     |- Weapons.Base_HeavyMelee
#     |- Weapons.Base_VeryHeavyMelee
#     '- Weapons.Base_Brawling
#
# Stats sourced from CP:RED Core Rulebook pp. 340-351.
# =============================================================================


# =============================================================================
# UNIVERSAL WEAPON ROOT
# =============================================================================

Weapons.Base_Weapon:
  $type: Weapon

  # --- Identity (all overridden at leaf) ---
  name:         ''
  description:  ''
  lore:         ''

  # --- Classification ---
  weaponType:       Pistol      # overridden at every archetype
  weaponCategory:   Standard    # overridden where needed (Military, Exotic, Melee)
  damageTypes:      [Physical]  # overridden for Thermal (flamethrower), Electric (stun)
  rarity:           Standard    # overridden at leaf

  # --- Core combat stats ---
  damage:           "1d6"
  rateOfFire:       1
  handsRequired:    1
  concealable:      false

  # --- Ranged-only fields (0 / false for melee) ---
  effectiveRange:   0
  magazineCapacity: 0
  armorPiercing:    false

  # --- Melee-only fields (0 for ranged) ---
  attackRange:      0

  # --- Modifier stacks ---
  statModifiers:      []
  statModifierGroups: []
  abilities:          []
  modSlots:           []

  # --- Economy ---
  cost: 0


# =============================================================================
# RANGED WEAPON ARCHETYPES
# =============================================================================

Weapons.Base_Pistol:
  # Light pistol — RED Core Rulebook p. 340
  $base: Weapons.Base_Weapon
  weaponType:       Pistol
  weaponCategory:   Standard
  damage:           "1d6"
  rateOfFire:       2
  handsRequired:    1
  concealable:      true
  effectiveRange:   25
  magazineCapacity: 8
  armorPiercing:    false
  cost:             50


