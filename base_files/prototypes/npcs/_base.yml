  # +4 STAT points above standard Lieutenant budget; max STAT remains 8
  # Gear budget: 1,000eb (no Excellent Quality restriction lifted); Cyberware: 1,500eb
  # Likely has Role Ability Rank 4

  attributes:
    reflexes:     8    # +1 from Elite default (7); reaches max STAT 8
    body:         8    # +1 from Elite default (7); reaches max STAT 8
    cool:         7    # +1 from Elite default (6)
    willpower:    7    # +1 from Elite default (6)

  # HP: 10 + (5 * ceil((8+7)/2)) = 10 + (5*8) = 50
  maxHP:      50
  currentHP:  50
  armor:      15


NPC.Base_HardenedGangElite:
  $base: NPC.Base_GangElite
  npcRarity:  HardenedLieutenant
  # Gang-flavoured Hardened Lieutenant. Inherits GangElite's body 8, reflexes 7, cool 7.
  # +4 STAT points applied to remaining stats.

  attributes:
    intelligence: 7    # +1 from GangElite default (6)
    willpower:    7    # +1 from Elite default (6)
    tech:         6    # +1 from Elite default (5)
    empathy:      5    # +1 from Elite default (4)

  # HP: 10 + (5 * ceil((8+7)/2)) = 10 + (5*8) = 50
  maxHP:      50
  currentHP:  50
  armor:      15


# =============================================================================
# HARDENED MINI-BOSS
# =============================================================================

NPC.Base_HardenedMiniBoss:
  $base: NPC.Base_MiniBoss
