# =============================================================================
# prototypes/npc/_base.yml
# NPC prototype chain for Cyberpunk TTRPG.
#
# Prototype hierarchy:
#
#   NPC.Base_NPC                        <- universal root; all NPC inherit from here
#     |- NPC.Base_Grunt                 <- disposable combatant (Mook / Normal tier)
#     |     |- NPC.Base_GangGrunt
#     |     |     '- NPC.Base_Bozo_Grunt
#     |     |- NPC.Base_CorpoSec_Grunt
#     |     '- NPC.Base_NCPD_Officer
#     |- NPC.Base_HardenedMook          <- Hardened Mook tier (DGD p.152: +6 STAT, max 7)
#     |     '- NPC.Base_HardenedGangGrunt
#     |           '- NPC.Base_Bozo_HardenedGrunt
#     |- NPC.Base_Elite                 <- seasoned combatant (Tough / Elite / Lieutenant tier)
#     |     |- NPC.Base_GangElite
#     |     '- NPC.Base_CorpoSec_Elite
#     |- NPC.Base_HardenedLieutenant    <- Hardened Lieutenant tier (DGD p.152: +4 STAT)
#     |     '- NPC.Base_HardenedGangElite
#     |- NPC.Base_Sniper                <- ranged specialist
#     |- NPC.Base_Netrunner_NPC         <- hacking NPC
#     |- NPC.Base_Medtech_NPC           <- support / healer NPC
#     |- NPC.Base_MiniBoss              <- mid-tier named threat
#     |     '- NPC.Base_HardenedMiniBoss  <- Hardened Mini-Boss tier (DGD p.152: +2 STAT)
#     |- NPC.Base_Boss                  <- major threat
#     |     |- NPC.Base_Bozo_Boss
#     |     '- NPC.Base_HardenedBoss    <- Hardened Boss tier (DGD p.152: +5 STAT, unlimited CW)
#     |           '- NPC.Base_Bozo_HardenedBoss
#     '- NPC.Base_NamedNPC              <- story-critical (example of a narrative only char)
#
# Stat assignment philosophy (RED Core Rulebook pp. 411-413):
#   NPC do NOT go through full PC character creation. The GM assigns stats
#   appropriate to threat level and narrative role.
#   HP formula is the same as PCs: 10 + (5 * ceil((BODY+WILL)/2)).
#   Skill totals listed here are FINAL totals (attribute + rank combined),
#   matching how RED presents NPC stat blocks in the rulebook.
# =============================================================================


# =============================================================================
# UNIVERSAL NPC ROOT
# =============================================================================

NPC.Base_NPC:
  $type: NPC

  # --- Identity (all overridden at leaf) ---
  name:           ''
  handle:         ''
  description:    ''
  age:            ''
  culturalOrigin: ''
  lore:           ''

  # --- Classification ---
  npcType:        EncounterNPC
  npcRole:        Grunt
  npcRarity:      Normal
  faction:        Neutral
  attitudeGroup:  Hostile

  # --- Attributes (minimum defaults; override at tier or leaf as needed) ---
  attributes:
    intelligence: 2
    reflexes:     2
    dexterity:    2
    tech:         2
    cool:         2
    willpower:    2
    luck:         2
    move:         2
    body:         2
    empathy:      2

  # Death Save base threshold (RED p. 64; some cyberware modifies this)
  deathSaveThreshold: 10

  # Derived stats — initialised to floor; resolver recomputes after attribute assignment
  # HP formula:       10 + (5 * ceil((BODY + WILL) / 2))
  # Run formula:      MOVE x 3
  # Humanity formula: EMP * 10 (then subtract humanityCost of installed cyberware)
  # Armor is gained through cyberware or items being equipped, base is 0
  derivedStats:
    maxHP:          20
    currentHP:      20
    armor:          0
    luckPool:       2
    run:            6

  # --- Skills, abilities, cyberware (empty; overridden at tier or leaf) ---
  skills:         []
  abilities:      []
  statModifiers:  []
  cyberware:      []

  # --- Equipment (empty at root; set at tier or leaf level) ---
  armorRecord:        ''           # Armor record ID
  primaryEquipment:
    weapon:           ''
    hand:             Primary
    equipCondition:   []
  secondaryEquipment:
    weapon:           ''
    hand:             Holstered

  # --- Loot / encounter flags ---
  dropsWeapon:    false
  otherDrops:     []
  isInvulnerable: false


# =============================================================================
# GRUNT TIER  (Mook / Normal)
# =============================================================================

NPC.Base_Grunt:
  $base: NPC.Base_NPC
  npcRole:        Grunt
  npcRarity:      Normal

  attributes:
    intelligence: 4
    reflexes:     5
    dexterity:    5
    tech:         2
    cool:         4
    willpower:    4
    luck:         3
    move:         5
    body:         5
    empathy:      3

  # HP: 10 + (5 * ceil((5+4)/2)) = 10 + (5*5) = 35
  maxHP:          35
  currentHP:      35
  armor:          7

  skills:
    - { skill: Handgun,         rank: 10 }  # DEX 5 + skill 5
    - { skill: Brawling,        rank: 8  }  # REF 5 + skill 3
    - { skill: Perception,      rank: 8  }  # REF 5 + skill 3
    - { skill: Stealth,         rank: 6  }  # REF 5 + skill 1
    - { skill: Athletics,       rank: 8  }  # REF 5 + skill 3

