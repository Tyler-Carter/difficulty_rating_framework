# =============================================================================
# HARDENED TIERS  (Danger Gal Dossier pp. 149-152)
#
# A "Hardened" NPC is a boosted version of the standard tier, used when the
# Crew is combat-optimised (i.e., every player is built for fighting).
# Each tier receives additional STAT points, a higher Cyberware budget, and an
# expanded Gear budget; some may also have a Role Ability at a higher rank.
#
# Stat budgets (per DGD p.152):
#   Hardened Mook      — +6 STAT pts (max STAT 7); +200eb Gear; +500eb Cyberware;
#                        may have Role Ability Rank 2
#   Hardened Lieutenant— +4 STAT pts (max STAT 8); +300eb Gear; +500eb Cyberware;
#                        likely has Role Ability Rank 4
#   Hardened Mini-Boss — +2 STAT pts (max STAT 8); +800eb Gear; +1,200eb Cyberware;
#                        may have Role Ability Rank 6
#   Hardened Boss      — +5 STAT pts (max STAT 8); +5,000eb Gear; unlimited Cyberware;
#                        may have Role Ability Rank 8; likely cyberpsycho (EMP 0)
#
# All attribute values below are prototype defaults. Leaf records override freely.
# =============================================================================


# =============================================================================
# HARDENED MOOK
# =============================================================================

NPC.Base_HardenedMook:
  $base: NPC.Base_Grunt
  npcRarity:  HardenedMook
  # +6 STAT points above standard Mook budget; max STAT raised to 7
  # Gear budget: 500eb (PQ allowed); Cyberware budget: 1,000eb

  attributes:
    intelligence: 5    # +1 from Grunt default (4)
    reflexes:     6    # +1 from Grunt default (5)
    cool:         5    # +1 from Grunt default (4)
    willpower:    5    # +1 from Grunt default (4)
    body:         7    # +2 from Grunt default (5); reaches max STAT 7

  # HP: 10 + (5 * ceil((7+5)/2)) = 10 + (5*6) = 40
  maxHP:      40
  currentHP:  40
  armor:      11       # Light Armorjack SP 11 is typical for Hardened Mooks


NPC.Base_HardenedGangGrunt:
  $base: NPC.Base_GangGrunt
  npcRarity:  HardenedMook
  # Gang-flavoured Hardened Mook. Inherits GangGrunt's cool 5, tech 1, willpower 3.
  # +6 STAT points above Mook budget applied here; max STAT 7.

  attributes:
    reflexes:     6    # +1
    dexterity:    6    # +1
    willpower:    5    # +2 from GangGrunt default (3)
    body:         7    # +2 from GangGrunt default (5); reaches max STAT 7

  # HP: 10 + (5 * ceil((7+5)/2)) = 10 + (5*6) = 40
  maxHP:      40
  currentHP:  40
  armor:      11


# =============================================================================
# HARDENED LIEUTENANT
# =============================================================================

NPC.Base_HardenedLieutenant:
