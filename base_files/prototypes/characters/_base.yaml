# =============================================================================
# prototypes/characters/_base.yml
# Player character prototypes for Cyberpunk TTRPG.
#
# Character creation order (RED Core Rulebook pp. 60-93):
#   Step 1  Choose a Role                 -> sets $base to the Role archetype
#   Step 2  Set ten attributes            -> 62 pts; min 2 max 8 per attribute
#   Step 3  Derive secondary stats        -> resolver computes HP, Humanity, etc.
#   Step 4  Assign skill points           -> Career Skills (86 pts) + Pickup (22 pts)
#   Step 5  Choose cyberware              -> each piece costs Humanity
#   Step 6  Record lifepath entries       -> cultural origin, background, events
#   Step 7  Select starting gear          -> role-specific starting package
#
# Prototype hierarchy:
#
#   Characters.Base_Character
#     |- Characters.Archetype_Rockerboy
#     |- Characters.Archetype_Solo
#     |- Characters.Archetype_Netrunner
#     |- Characters.Archetype_Tech
#     |- Characters.Archetype_Medtech
#     |- Characters.Archetype_Media
#     |- Characters.Archetype_Lawman
#     |- Characters.Archetype_Exec
#     |- Characters.Archetype_Fixer
#     '- Characters.Archetype_Nomad
#
# Skill ranks in PC records:
#   PC records store the RAW RANK only (0-10), NOT the attribute+rank total.
#   The resolver adds the governing attribute at presentation time.
#   This differs from NPC records, which store pre-summed totals for speed.
# =============================================================================


# =============================================================================
# UNIVERSAL CHARACTER ROOT
# =============================================================================

Characters.Base_Character:
  $type: Character

  # --- Identity (all overridden at leaf) ---
  name:           ''
  handle:         ''
  description:    ''
  age:            null
  faction:        Neutral
  culturalOrigin: NorthAmerican

  # --- Role (overridden by each Archetype; required on every resolved leaf) ---
  roleAbility:
    role:  Lawman               # placeholder; every Archetype overrides this
    rank:  2                    # floor rank; leaf records set their actual rank

  # Attribute floor values (minimum 2 per RED rules)
  attributes:
    intelligence: 2
    reflexes:     2
    dexterity:    2
    tech:         2
    cool:         2
    willpower:    2
    luck:         2
    move:         2
    body:         2
    empathy:      2

  # Death Save base threshold (RED p. 64; some cyberware modifies this)
  deathSaveThreshold: 10

  # Derived stats — initialised to floor; resolver recomputes after attribute assignment
  # HP formula:       10 + (5 * ceil((BODY + WILL) / 2))
  # Run formula:      MOVE x 2
  # Humanity formula: EMP * 10 (then subtract humanityCost of installed cyberware)
  # Armor is gained through cyberware or items being equipped, base is 0
  derivedStats:
    maxHP:        20
    currentHP:    20
    armor:        0
    humanity:     20
    humanityLost: 0
    luckPool:     2
    run:          4
    carryWeight:  20

  # --- Skills, abilities, cyberware (empty; overridden at tier or leaf) ---
  skills:         []
  abilities:      []
  statModifiers:  []
  cyberware:      []
  gear:           []
  lifepath:       []

  # --- Equipment (empty at root; set at archetype or leaf level) ---
  armorRecord:          ''            # Armor record ID
  primaryEquipment:
    weapon:             ''
    hand:               Primary
  secondaryEquipment:
    weapon:             ''
    hand:               Holstered

# =============================================================================
# ROLE ARCHETYPES
# Each Archetype extends Base_Character and sets:
#   - roleAbility (role + starting rank 4 — the RED default for a new character)
#   - A representative spread of career skills at rank 2
#   - Any role-specific stat modifier that applies to all characters of this Role
#
# Career skill lists are sourced from RED Core Rulebook pp. 96-213.
# Starting rank 2 is the prototype floor. Leaf records raise individual skills
# with !append. Players who want higher ranks append overrides.
# =============================================================================

# =============================================================================
# ROCKERBOY  (RED pp. 96-111)
# Special ability: Charismatic Impact
#   At rank 1 affects small groups; at rank 10 can sway entire districts.
#   Governs crowd control performances and social domination effects.
# Primary stats: EMP, COOL
# =============================================================================

Characters.Archetype_Rockerboy:
  $base: Characters.Base_Character

  roleAbility:
    role:  Rockerboy
    rank:  1

  # Suggested attribute spread, players will be able to redistribute freely within 62-pt budget
  attributes:
    intelligence: 6
    reflexes:     5
    dexterity:    5
    tech:         3
    cool:         8
    willpower:    5
    luck:         5
    move:         5
    body:         5
    empathy:      8
  # HP: 10 + (5 * ceil((5+5)/2)) = 35
  # Humanity: empathy * 10 = 80

  # Career Skills — rank 0; players allocate 86 pts here (max rank 6 at creation)
  skills:
    - { skill: Acting,            rank: 0 }
    - { skill: Brawling,          rank: 0 }
    - { skill: Concentration,     rank: 0 }
    - { skill: Dancing,           rank: 0 }
    - { skill: Handgun,     rank: 0 }
    - { skill: HumanPerception,   rank: 0 }
    - { skill: Perception,        rank: 0 }
    - { skill: Performance,       rank: 0 }
    - { skill: Persuasion,        rank: 0 }
    - { skill: PlayInstrument,    rank: 0 }
    - { skill: Streetwise,        rank: 0 }
    - { skill: WardrobeStyle,     rank: 0 }

  gear:
    - Item.StartingGear_Rockerboy


