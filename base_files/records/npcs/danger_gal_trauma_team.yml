NPC.TraumaTeam_Twist:
  $base: NPC.Base_TraumaTeam_Guard
  name: ""
  handle: "Twist"
  description: "Squad Metal Specialist"
  lore: >
    No surprise Twist grew up with his sister Stick and learned the family business; but after
    only a few months playing medic, he got bitten by the fame bug and made a play for stardom
    as an independent Pop Media reporter under the name Flashes. His biggest story was about the
    apartment collapse that nearly offed his sister. Two assassination attempts later, Flashes
