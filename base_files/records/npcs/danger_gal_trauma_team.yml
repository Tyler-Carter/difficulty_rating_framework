NPC.TraumaTeam_Paddles:
  $base: NPC.Base_TraumaTeam_Medtech
  name: ""
  handle: "Paddles"
  description: "Squad Crash Cart Specialist"
  lore: >
    Paddles gets his name from his novel way of using his defibrillator in combat, a habit he
    picked up in Combat Zone training missions. He's the one who convinced Stick to defect to
    REO Meatwagon from Trauma Team — and collected a signing bonus for bringing the two of them
    over. Stick presumably doesn't know. Of all the team, Paddles is the one to watch out for in
