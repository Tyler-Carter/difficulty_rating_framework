NPC.TraumaTeam_Rockabye:
  $base: NPC.Base_TraumaTeam_Medtech
  name: ""
  handle: "Rockabye"
  description: "Squad Pilot"
  lore: >
    There's no dark secret here, just straight-up guilt. Rockabye delivered the explosives used
    to nearly flatten Cazadora and company, though all seems forgiven. She still clearly feels bad
    for her role in the attack. A spectacular and single-minded pilot — she gets her name from the
    silky-smooth ride casualties get out of danger zones, yet she bombs into trouble spots like
    a total demon.
