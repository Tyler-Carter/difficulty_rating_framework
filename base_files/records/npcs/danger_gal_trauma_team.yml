NPC.TraumaTeam_Cazadora:
  $base: NPC.Base_TraumaTeam_Guard
  name: ""
  handle: "Cazadora"
  description: "Squad Leader"
  lore: >
    Cazadora's a Spaniard by birth, out of the mountains of Guadalajara. She's from a long line
    of bounty hunters who taught little Caz anatomy alongside her combat skills. Eighteen months
    back she was on a solo mission in Night City when demolition charges went off; she led the
    remaining survivors out of the rubble. Her subsequent therapy sessions identified a calling —
    she joined Trauma Team.
  npcType: RecurringNPC
  faction: Trauma_Team
  attitudeGroup: Neutral

  attributes:
    intelligence: 4
    reflexes:     8
    dexterity:    7
    tech:         8
    cool:         6
    willpower:    7
    luck:         5
    move:         5
