# CRUSHER — Cyberpsycho Urban Legend
# Hardened Boss
# ---------------------------------------------------------------------------
NPC.Maelstrom_Crusher:
  $base: NPC.Base_HardenedBoss
  name: ""
  handle: "Crusher"
  description: "Cyberpsycho Urban Legend"
  lore: >
    Crusher became Maelstrom's leader when its founder died after Arasaka Tower fell.
    He rallied survivors, fought through burning streets, and dueled a rival gang
    leader for what became Maelstrom's Totentanz headquarters. In 2027, during a
    cyberpsychotic episode, he slaughtered a StormTech convoy and vanished into the
    Hot Zone. He makes seemingly random reappearances — Maelstrom's personal angry god.
  npcType: RecurringNPC
  faction: Maelstrom
  attitudeGroup: Hostile

  attributes:
    intelligence: 7
    reflexes:     8
