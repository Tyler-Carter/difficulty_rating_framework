NPC.Maelstrom_ThePit:
  $base: NPC.Base_HardenedMiniBoss
  name: ""
  handle: "The Pit"
  description: "Pet Cyberpsycho"
  lore: >
    Way down in the sub-sub-basement of Burleson Tower, a monster stalks. The gang
    throws people down to fight it. Nobody wins. It used to be human. It believes
    it's a monster. Joe Pitt had to bolt a mask on the thing because eating its
    victims was making it sick. Gangers stand around watching and yelling
    "Feed 'em to The Pit!" like it's funny.
