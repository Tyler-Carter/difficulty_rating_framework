  $base: NPC.Base_HardenedGangGrunt
  name: ""
  handle: "Raguel"
  description: "Recent Convert"
  lore: >
    A former Inquisitor who infiltrated the Heart of the Metal Devil and was
    corrupted by it. He dropped off the radar in a NeoLuddite fascist colony
