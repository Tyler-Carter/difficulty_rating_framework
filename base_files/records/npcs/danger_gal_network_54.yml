NPC.Network54_FionaHayes:
  $base: NPC.Base_NamedNPC
  name: "Fiona Hayes"
  handle: "Fiona Hayes"
  description: "Night City Investigative Powerhouse"
  lore: >
    Fiona Hayes is a pragmatic and ambitious investigative reporter, and the star of Net54 in
    Night City. Since the 2010s, she has reported on the most hard-hitting stories, from political
    scandals to big gang conspiracies. The main rumor opines she is not the "original" Fiona Hayes —
    and the rumors are, in this case, one hundred percent true.
  npcType: RecurringNPC
  faction: Network_54
  attitudeGroup: Neutral

  attributes:
