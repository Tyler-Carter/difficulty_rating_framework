NPC.Piranhas_BazookaJoe:
  $base: NPC.Base_Boss
  name: ""
  handle: "Bazooka Joe"
  description: "The Piranha's Teeth"
  lore: >
    Literally the oldest active Piranha still alive, Bazooka Joe serves as Corpse Reviver's
    right-hand lieutenant and oversees security. Bazooka Joe puts the teeth in Piranhas, focusing
    on training new recruits to keep parties lively and safe. A junkyard dog when anyone comes
    after one of the Piranhas or messes with one of their events.
  npcType: RecurringNPC
  faction: Piranhas
  attitudeGroup: Hostile

  attributes:
    intelligence: 5
    reflexes:     7
    dexterity:    6
    tech:         3
    cool:         6
    willpower:    4
