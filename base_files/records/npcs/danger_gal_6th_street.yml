# ---------------------------------------------------------------------------
# Arbiter — Squad Leader / Sniper
# Mini-Boss → NPC.Base_MiniBoss
# ---------------------------------------------------------------------------
NPC.6thStreet_Arbiter:
  $base: NPC.Base_MiniBoss
  name: ""
  handle: "Arbiter"
  description: "6th Street Davis Squad leader; LawMan (Backup 4). Possibly one of the best snipers in Night City."
  lore: >
    X's son and leader of the 6th Street Davis Squad. Grew up under the tutelage of hundreds of veterans
    over two decades. First and foremost a sniper — during his first mission he decimated a Raffen Shiv pack
    with head shot after head shot from over 800 m away. His constant joking and chatter conceals sharp
    tactical thinking focused on team cohesion.
  npcType: RecurringNPC
  faction: 6th_Street
  attitudeGroup: Hostile

  attributes:
    intelligence: 7
    reflexes:     8
    dexterity:    5
    tech:         4
    cool:         8
    willpower:    6
    luck:         5
    move:         4
    body:         5
    empathy:      4

  derivedStats:
    maxHP:   40
    currentHP: 40
    armor:   15

  deathSaveThreshold: 5

  skills:
    - !append { skill: Athletics,          rank: 12 }
    - !append { skill: Brawling,           rank: 7  }
    - !append { skill: Concentration,      rank: 1  }
    - !append { skill: ConversationCool,   rank: 7  }
    - !append { skill: Criminology,        rank: 12 }
    - !append { skill: Deduction,          rank: 12 }
    - !append { skill: Education,          rank: 1  }
    - !append { skill: Evasion,            rank: 14 }
    - !append { skill: FirstAid,           rank: 6  }
    - !append { skill: HumanPerception,    rank: 12 }
    - !append { skill: LinguisticsBase,    rank: 13 }
    - !append { skill: LipReading,         rank: 1  }
    - !append { skill: LocalExpert,        rank: 13 }
    - !append { skill: PersonalGrooming,   rank: 13 }
    - !append { skill: Perception,         rank: 13 }
    - !append { skill: Persuasion,         rank: 15 }
    - !append { skill: ShoulderArms,       rank: 16 }
    - !append { skill: Stealth,            rank: 10 }
    - !append { skill: Tactics,            rank: 12 }
    - !append { skill: Tracking,           rank: 12 }
    - !append { skill: WardrobeStyle,      rank: 13 }

  cyberware:
    - !append Cyberware.DangerGal_Cybereye_AntiDazzle_ImageEnhance
    - !append Cyberware.DangerGal_Cyberarm_GrappleHand_Techair

  primaryEquipment:
    weapon: Weapons.SniperRifle_Excellent_SniperScope
    hand: TwoHanded

  secondaryEquipment:
    weapon: Weapons.HeavyPistol_Standard
    hand: Holstered

  dropsWeapon: true
  isInvulnerable: false


