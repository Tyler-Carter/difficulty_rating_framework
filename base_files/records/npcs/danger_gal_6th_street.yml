# Hardened Lieutenant → NPC.Base_HardenedLieutenant
# ---------------------------------------------------------------------------
NPC.6thStreet_Coldfire:
  $base: NPC.Base_HardenedLieutenant
  name: ""
  handle: "Coldfire"
  description: "6th Street Davis Squad; Solo (Combat Awareness 4). Former Arasaka-linked operative; complex loyalties."
  lore: >
    Fought on the "wrong" side of the 4th Corporate War — daughter of middle Arasaka management who fled to
    Japan, she stayed behind and went dark. Resurfaced as Coldfire roughly a decade later. Neither her ties
    to Arasaka nor who at 6th Street knows her past have been confirmed. In battle she is described as a
    goddamn action heroine: she once charged a Militech transport solo and neutralised it in seconds.
