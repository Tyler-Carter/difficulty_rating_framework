# Hardened Mook → NPC.Base_HardenedMook
# ---------------------------------------------------------------------------
NPC.6thStreet_KnockKnock:
  $base: NPC.Base_HardenedMook
  name: ""
  handle: "Knock!Knock!"
  description: "6th Street Davis Squad; Solo (Combat Awareness 2). Oldest member; fought in all four Corporate Wars."
  lore: >
    The oldest member of Davis Squad, Knock!Knock! fought in all four Corporate Wars but gets slower each
    decade. Their knowledge of Corporate War history is staggering, even if their skill set is focused
    entirely on close-range combat. Patient and places civilian lives above those of the team — known to
    stop mid-firefight to perform first aid on bystanders.
