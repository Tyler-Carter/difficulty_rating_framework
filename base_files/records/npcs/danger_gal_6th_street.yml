NPC.6thStreet_Breacher:
  $base: NPC.Base_Elite
  name: ""
  handle: "Breacher"
  description: "6th Street Davis Squad second-in-command; Solo (Combat Awareness 4). Former pro-boxer from Mexico City."
  lore: >
    A former pro-boxer from Mexico City who became a soldier when the 4th Corporate War erupted mid-tour.
    Their manager died in the early fighting — his last words, "Fuck Arasaka!", became their motto. Second
    in command of the Davis Squad, always in the heat of battle. A highly skilled covert operative with
    extensive close-combat expertise in small arms, melee weapons, and boxing.
