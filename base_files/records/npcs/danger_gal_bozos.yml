  name: "Terry Claymora"
  handle: "Centwit"
  description: "Bozo Lieutenant; Solo (Combat Awareness 4). Third-generation clown; terrorises the Voodoo Boys since 2020."
  lore: >
    Terry Claymora comes from an actual clown legacy — third-generation member of the Claymoras, a clown
    family going back a century. His father died in Night City, mistaken for a Bozo and assassinated by
    the Voodoo Boys. An apprentice clown, Terry fled into the Combat Zone and the Bozos found him. He
    joined, took the name Centwit, and has been hitting the Voodoo Boys from the shadows ever since.
