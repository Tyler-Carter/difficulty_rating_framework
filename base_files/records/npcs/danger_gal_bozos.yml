# Jester — Bouncing Bozo Beauty
# Mini-Boss → NPC.Base_MiniBoss
# ---------------------------------------------------------------------------
NPC.Bozos_Jester:
  $base: NPC.Base_MiniBoss
  name: "Jade Sky"
  handle: "Jester"
  description: "Bozo Mini-Boss; Rockerboy (Charismatic Impact 4). Former acrobatic fire-spinner; lost both legs in a theater fire."
  lore: >
    Once one of Night City's greatest acrobatic fire-spinners. During a helium-balloon performance a fire
    ignited the gas, killing ninety-four and costing Jade both legs. She vanished, then resurfaced as
    Jester, sporting cyberlegs installed by Big Top himself. Her favourite prank is performing as a street
    busker, luring in a crowd, then watching circus-mates rush from the shadows. Lives for spectacle —
    takes more risks when there is an audience.
