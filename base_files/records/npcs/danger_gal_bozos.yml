# Hardened Mook → NPC.Base_Bozo_HardenedGrunt
# ---------------------------------------------------------------------------
NPC.Bozos_BurtTheSquirt:
  $base: NPC.Base_Bozo_HardenedGrunt
  name: "Burt Batail"
  handle: "Burt The Squirt"
  description: "Bozo Hardened Mook. Acid-obsessed; lost his hair in an industrial accident and has been chemically destructive ever since."
  lore: >
    After losing all his hair in an industrial accident, Burt became obsessed with acid — experimenting
    to perfectly recreate the mixture that took his hair. He wants to inflict permanent baldness on Night
    City. He joined the Bozos because they promised him an unlimited supply of chemicals. Carries a gun
    loaded with acid rounds and will always target the enemy with the best hair first.
  npcType: RecurringNPC
  faction: Bozos
  attitudeGroup: Berserk

  attributes:
    intelligence: 3
    reflexes:     6
    dexterity:    4
    tech:         5
    cool:         5
    willpower:    5
    luck:         3
    move:         5
    body:         7
    empathy:      1

  derivedStats:
    maxHP:   40
    currentHP: 40
    armor:   7

  deathSaveThreshold: 7

  skills:
    - !append { skill: Athletics,           rank: 10 }
    - !append { skill: BasicTech,           rank: 8  }
    - !append { skill: Brawling,            rank: 7  }
    - !append { skill: Concentration,       rank: 6  }
    - !append { skill: ConversationCool,    rank: 3  }
    - !append { skill: Education,           rank: 5  }
    - !append { skill: Evasion,             rank: 12 }
    - !append { skill: FirstAid,            rank: 7  }
    - !append { skill: Handgun,       rank: 12 }
    - !append { skill: HumanPerception,     rank: 3  }
    - !append { skill: Interrogation,       rank: 10 }
    - !append { skill: LinguisticsBase,     rank: 7  }
    - !append { skill: LocalExpert,         rank: 5  }
    - !append { skill: Perception,          rank: 5  }
    - !append { skill: Persuasion,          rank: 6  }
    - !append { skill: ResistTortureDrugs,  rank: 10 }
    - !append { skill: Stealth,             rank: 6  }

  cyberware:
    - !append Cyberware.DangerGal_ExoticBodysculpting
    - !append Cyberware.DangerGal_Cybereye_ColorShift_x2

  primaryEquipment:
    weapon: Weapons.HeavyPistol_Poor
    hand: Primary

  dropsWeapon: true
  isInvulnerable: false


