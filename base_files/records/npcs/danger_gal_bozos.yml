# Mook → NPC.Base_Bozo_Grunt
# ---------------------------------------------------------------------------
NPC.Bozos_Dunce:
  $base: NPC.Base_Bozo_Grunt
  name: "Sion Bannerkin"
  handle: "Dunce"
  description: "Bozo Mook. Graduated from Fool to full Bozo after surviving Hilaria 2045; wields a spiked baseball bat."
  lore: >
    One Fool made it through Hilaria 2045 to become a full Bozo. Dunce insists "it's all in his smile."
    During the fight at the Forlorn Hope he lost both guns in the sewage but a baseball bat he found
    in the muck saved his life. He stumbled away covered in blood, sewage, and glitter with a hole in
    his chest. As a reward, Big Top fixed him up and melted a mask onto his face. Will always go for
    the nose.
