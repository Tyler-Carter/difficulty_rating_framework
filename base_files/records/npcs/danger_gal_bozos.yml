NPC.Bozos_Tomfool:
  $base: NPC.Base_HardenedLieutenant
  name: "Tom Smart"
  handle: "Tomfool"
  description: "Bozo Hardened Lieutenant; Solo (Combat Awareness 4). Former underground bloodsport killer clown."
  lore: >
    Tom Smart had the clown biosculpt before the Bozos — it was his gimmick in the underground bloodsport
    scene. The Bozos tried to recruit him but he refused unless one of their number could beat him in the
    ring; none could. After Hilaria 2045, Big Top visited Tom. Whatever was offered bought his loyalty.
    He is now lead combatant for Big Top's circus in street brawls, softening enemies with an air cannon
    before closing in with Judo.
