# ---------------------------------------------------------------------------
# Big Top — Scalpel-Wielding Ringleader
# Hardened Boss → NPC.Base_Bozo_HardenedBoss
# ---------------------------------------------------------------------------
NPC.Bozos_BigTop:
  $base: NPC.Base_Bozo_HardenedBoss
  name: ""
  handle: "Big Top"
  description: "Bozo ringleader; Medtech (Medicine 8). Biosculpted, heavily cyberwareD ringleader who instigated the Bozo civil war."
  lore: >
    Big Top isn't the mythical Great Bozo — he rails against him, calling him stale and unfunny. In his
    mind he is the future: louder, flashier, crueler. He instigated the Hilaria 2045 event by biosculpting
    and Braindance-mindwashing captured civilians before releasing them on the Forlorn Hope, sparking the
    Bozo civil war. Obviously trained as a Medtech; has been seen operating in the streets on friend and
    foe alike.
  npcType: RecurringNPC
  faction: Bozos
  attitudeGroup: Berserk

  attributes:
    intelligence: 6
