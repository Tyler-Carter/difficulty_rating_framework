# Mook → NPC.Base_Bozo_Grunt
# Generic Bozo initiate template; not a specific person
# ---------------------------------------------------------------------------
NPC.Bozos_TheFool:
  $base: NPC.Base_Bozo_Grunt
  name: ""
  handle: "The Fool"
  description: "Generic Bozo initiate template. Fresh meat in the Good Luck Bag mask; pushed to the front line as a human shield."
  lore: >
    There's always a Fool on a Bozo battlefield. The Fool isn't a specific person but a form of initiation.
    The Bozos give "less promising" recruits a mask known as the Good Luck Bag and push them to the front.
    Fresh meat makes a good shield. If a Fool survives until the next recruit arrives, they hand off the
    mask and earn the biosculpting needed to become a proper Bozo. The bag is taken from a corpse more
    often than it is handed over willingly.
