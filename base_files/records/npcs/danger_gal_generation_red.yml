NPC.GenerationRed_Tetra:
  $base: NPC.Base_HardenedGangGrunt
  name: "Andrea Olivetti"
  handle: "Tetra"
  description: "Latchkey Kid Chaos"
  lore: >
    Born Andrea Olivetti to Petrochem security Execs who are decidedly absent parents.
    Tetra smuggled a rocket launcher out of their unsecured weapons closet and used it
    against gangers trying to oust Generation Red from their clubhouse. The martial arts
    classes her parents signed her up for have also proved useful. She met most of
    Generation Red via Wheelie, and is fiercely loyal to her new family.
