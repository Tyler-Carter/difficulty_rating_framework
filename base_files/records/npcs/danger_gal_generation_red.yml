# ---------------------------------------------------------------------------
# BLADES — On the Edge of Adulthood
# Lieutenant / Gang Elite
# ---------------------------------------------------------------------------
NPC.GenerationRed_Blades:
  $base: NPC.Base_GangElite
  name: ""
  handle: "Blades"
  description: "On the Edge of Adulthood"
  lore: >
    Birth name unknown. Blades has been on The Street since she was a very young child,
    surviving on sheer grit, determination, and a lot of luck. She knows the scavenging
    sites of the Old Combat Zone inside and out. She lost her eye and her legs fighting
    off scavengers, and earned a reputation for fighting like a wildcat. Danger Gal
    funded replacement cyberlegs with skate feet as a gesture of good will.
  npcType: RecurringNPC
  faction: Generation_Red
  attitudeGroup: Hostile

  attributes:
    intelligence: 4
    reflexes:     7
    dexterity:    6
    tech:         3
    cool:         5
    willpower:    4
    luck:         4
    move:         7
    body:         3
    empathy:      5

