# ---------------------------------------------------------------------------
# CALIBER — Sergeant Alexander Marconi
# Boss (NCPD)
# ---------------------------------------------------------------------------
NPC.NCPD_Caliber:
  $base: NPC.Base_Boss
  name: "Alexander Marconi"
  handle: "Caliber"
  description: "Sergeant Alexander Marconi"
  lore: >
    A consummate professional with an excellent kill record: 34 out of 36 shots
    taken. Fellow officers value him on overwatch, yet he refuses even to use a
    spotter, violating TAC policy — and gets away with it. He has no social life
    and has never triggered a required psych evaluation. At least twelve unsolved
    long-range assassinations share his M.O. in the Precinct area. He may be a
    deep-plant assassin in police clothing.
  npcType: RecurringNPC
  faction: NCPD
  attitudeGroup: Neutral

  attributes:
    intelligence: 8
    reflexes:     8
    dexterity:    8
    tech:         6
    cool:         6
    willpower:    7
    luck:         6
    move:         6
