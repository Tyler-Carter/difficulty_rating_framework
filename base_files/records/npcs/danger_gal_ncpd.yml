  handle: "Hellhound"
  description: "Detective William Mauser"
  lore: >
    Like his namesake, once Bill Mauser is on a case he does not let go. Utterly
    incorruptible, he uses his brains before his gun but will resort to strong-arm
    tactics to loosen lips. He focuses on high-level crime — serial killers and
    potential cyberpsychos. If he thinks you are interfering with an investigation
    he will have you barred from every crime scene in Precinct 1. His medical file
