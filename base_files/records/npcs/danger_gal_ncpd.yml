  name: "Philip Escobar"
  handle: "Escobar"
  description: "Detective Philip Escobar"
  lore: >
    An INTERPOL agent with the Fugitive Investigative Support Division, working
    alongside the NCPD on cases involving criminals moving across international
    borders. As a man of the world, he understands quid pro quo. Not exactly corrupt,
