# ---------------------------------------------------------------------------
NPC.DigitalDivas_JoseQuispe:
  $base: NPC.Base_NamedNPC
  name: "José Quispe"
  handle: "Jose Quispe"
  description: "Brat-Punk Songsmith — Digital Divas' songwriter and keytarist."
  lore: >
    Raised on Nomad trade routes between Bolivia and the Pacifica Confederation,
    José came to Night City at thirteen with rock-star dreams. He ran errands
    for the Desperados gang but never touched the merchandise, surviving as the
    last Desperado standing. His Spanish and Quechua give his songs a unique flair.
