# ---------------------------------------------------------------------------
# Andre Nez — Gunner Turned Drummer (Lieutenant, Solo)
# Note: Uses a Rocklin Augmentics Mercurius Cyberchair (wheelchair).
# ---------------------------------------------------------------------------
NPC.DigitalDivas_AndreNez:
  $base: NPC.Base_NamedNPC
  name: "André Nez"
  handle: "Andre Nez"
  description: "Gunner Turned Drummer — Digital Divas' powerhouse percussionist."
  lore: >
    André joined Militech's army after growing up an orphan in Night City,
    channelling street-survival rage into a military career. Discharged after
    refusing to kill a Nomad kid, he lost his legs in a construction accident
    and now navigates Night City in a Rocklin Augmentics Mercurius Cyberchair,
    projecting that same primal rage into playing drums.
  npcType: RecurringNPC
  faction: Digital_Divas
  attitudeGroup: Neutral

  attributes:
    intelligence: 4
    reflexes:     5
    dexterity:    6
    tech:         4
    cool:         5
    willpower:    5
    luck:         4
    move:         5
    body:         5
    empathy:      6

  derivedStats:
    maxHP: 35
    currentHP: 35
    armor: 11   # Subdermal Armor → minimum 11

  deathSaveThreshold: 5

  skills:
    - !append { skill: Athletics,          rank: 12 }
    - !append { skill: Brawling,           rank: 14 }
    - !append { skill: Concentration,      rank: 7 }
    - !append { skill: ConversationCool,   rank: 10 }
    - !append { skill: Education,          rank: 6 }
    - !append { skill: EnduranceSTR,       rank: 13 }
    - !append { skill: Evasion,            rank: 1 }
    - !append { skill: FirstAid,           rank: 6 }
    - !append { skill: HumanPerception,    rank: 8 }
    - !append { skill: Interrogation,      rank: 7 }
    - !append { skill: LinguisticsBase,    rank: 8 }
    - !append { skill: LocalExpert,        rank: 6 }
    - !append { skill: MeleeCombat,        rank: 13 }
    - !append { skill: Perception,         rank: 1 }
    - !append { skill: PersonalGrooming,   rank: 10 }
    - !append { skill: Persuasion,         rank: 14 }
    - !append { skill: PlayInstrument,     rank: 12 }
    - !append { skill: ShoulderArms,       rank: 13 }
    - !append { skill: Stealth,            rank: 8 }
    - !append { skill: WardrobeStyle,      rank: 10 }

  cyberware:
    - !append Cyberware.DangerGal_MedicalGrade_Cyberarm_x2
    - !append Cyberware.DangerGal_KiroshiOptiShields
    - !append Cyberware.DangerGal_NeuralLink_InterfacePlugs
    - !append Cyberware.DangerGal_SubdermalArmor

  primaryEquipment:
    weapon: Weapons.HeavyMeleeWeapon_Standard
    hand: Primary

  secondaryEquipment:
    weapon: Weapons.HeavyMeleeWeapon_Standard_2
    hand: Primary

  dropsWeapon: true
  isInvulnerable: false


