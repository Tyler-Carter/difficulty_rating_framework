# ---------------------------------------------------------------------------
# Pantera — One Badas Librarian (Hardened Mini-Boss, Netrunner)
# ---------------------------------------------------------------------------
NPC.DangerGal_Pantera:
  $base: NPC.Base_HardenedMiniBoss
  name: "Shoko Asagiri"
  handle: "Pantera"
  description: "One Badass Librarian — Danger Gal's elite Netrunner operative."
  lore: >
    Born in Vancouver to a Braindance editor and a Biotechnica fauna designer,
    Shoko Asagiri pursued a Master's in Library Sciences before relocating to
    Night City. Entered Danger Gal's notice after a series of exceptionally
    discreet data thefts of unreleased Elflines Online Chronicles footage —
    kept purely for personal viewing pleasure.
  npcType: RecurringNPC
  npcRole: Netrunner_NPC
  faction: Danger_Gal
  attitudeGroup: Friendly

  attributes:
    intelligence: 8
    reflexes:     5
    dexterity:    5
    tech:         7
    cool:         6
    willpower:    6
    luck:         5
    move:         6
    body:         5
    empathy:      6

  derivedStats:
    maxHP: 40
    currentHP: 40
    armor: 15

  deathSaveThreshold: 5

  skills:
