NPC.Sightseers_Glare:
  $base: NPC.Base_GangGrunt
  name: ""
  handle: "Glare"
  description: "The Eyes of the Pack"
  lore: >
    After being captured and blinded by the Red Chrome Legion early in his Solo career, Glare
    replaced his eyes with medical-grade cyberware. Less than a day later, he was on a roof
    picking off gangers with his pneumatic bolt gun. He made a name for himself as a streetmerc,
