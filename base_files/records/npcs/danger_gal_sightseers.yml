NPC.Sightseers_Swirl:
  $base: NPC.Base_GangGrunt
  name: ""
  handle: "Swirl"
  description: "The Newbie of the Pack"
  lore: >
    Swirl is the youngest member and most recent addition to the Sightseers, eager to prove her
    worth. She's spent most of her youth hopping from one Nomad Pack to another, never quite
    fitting in — largely due to her proclivity for pocketing every shiny object she sets her eyes
    on. Endo pulled her out of an NCPD chase and nicknamed her for her mesmerizing shift tacts.
