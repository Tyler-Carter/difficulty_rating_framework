NPC.Sightseers_Endo:
  $base: NPC.Base_GangElite
  name: ""
  handle: "Endo"
  description: "The Heart of the Pack"
  lore: >
    Endo has a kind heart — albeit one plated with subdermal armor — and a habit of landing in
    sticky situations. He got his start as a mobile enforcer protecting locals of Santo Domingo from
    outside influence. His beliefs push him to move scavenged cyberware and weaponry from the city
    center to poorer communities on the outskirts, and he was the catalyst for the Sightseers.
  npcType: RecurringNPC
  faction: Sightseers
  attitudeGroup: Hostile

  attributes:
    intelligence: 5
    reflexes:     6
    dexterity:    7
    tech:         4
    cool:         5
    willpower:    5
    luck:         5
    move:         4
    body:         6
    empathy:      5

  derivedStats:
    maxHP: 40
    currentHP: 40
    armor: 11        # Subdermal Armor → minimum SP 11

  deathSaveThreshold: 6

  skills:
    - !append { skill: Athletics,           rank: 12 }
    - !append { skill: BasicTech,           rank: 8 }
    - !append { skill: Brawling,            rank: 14 }
    - !append { skill: Concentration,       rank: 7 }
    - !append { skill: ConversationCool,    rank: 7 }
    - !append { skill: DriveLandVehicle,    rank: 14 }
    - !append { skill: Education,           rank: 7 }
    - !append { skill: Evasion,             rank: 10 }
    - !append { skill: FirstAid,            rank: 6 }
    - !append { skill: Handgun,       rank: 14 }
    - !append { skill: HeavyWeapons,        rank: 14 }
    - !append { skill: HumanPerception,     rank: 9 }
    - !append { skill: LinguisticsBase,     rank: 9 }
    - !append { skill: LocalExpert,         rank: 7 }
    - !append { skill: Perception,          rank: 7 }
    - !append { skill: Persuasion,          rank: 10 }
    - !append { skill: Stealth,             rank: 10 }

  cyberware:
    - !append Cyberware.DangerGal_SubdermalArmor

  primaryEquipment:
    weapon: Weapons.HeavyPistol_Standard
    hand: Primary

  dropsWeapon: true
  isInvulnerable: false


