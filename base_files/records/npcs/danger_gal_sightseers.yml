NPC.Sightseers_Racer:
  $base: NPC.Base_GangElite
  name: "Racer Rajavi"
  handle: "Racer"
  description: "The Leader of the Pack"
  lore: >
    Racer Rajavi would tell you her job is moving goods to make ends meet and that all she wants
    is to live long enough to see another sunrise from the driver's seat. Her track record says
    otherwise — she works hard to improve the lives of those around her. As far as she's concerned,
    her Kombi's living quarters are all the home she needs.
