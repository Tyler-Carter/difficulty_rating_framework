NPC.Zoners_Alpha:
  $base: NPC.Base_GangGrunt
  name: ""
  handle: "Alpha"
  description: "Smart Scavenger"
  lore: >
    Most consider living in South Night City to be either a death sentence or hell on Earth,
    but Alpha sees it as an opportunity for anyone brave enough to do whatever it takes. A skilled
    gunfighter with a flair for killing and little qualm about yanking out chrome and selling it.
    Alpha is the sort of scavenger who watches fights play out, learns how the winners operate,
