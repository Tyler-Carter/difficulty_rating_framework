NPC.Zoners_Wrecker:
  $base: NPC.Base_GangGrunt
  name: "Scarlet Harris"
  handle: "Wrecker"
  description: "Student? Activist? Journalist?"
  lore: >
    Scarlet Harris, aka Wrecker, is a sophomore at Night City University dual majoring in
    journalism and political science. She has snuck out nightly from her dorm to support the
    Zoners movement for the last two months. When arrested during a protest, a fleet of elite
    lawyers swooped down on the precinct within two hours, and she was out on the street shortly
