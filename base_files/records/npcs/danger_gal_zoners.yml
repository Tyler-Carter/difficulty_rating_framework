  $base: NPC.Base_GangGrunt
  name: "Johnny Hammond"
  handle: "Blaze"
  description: "Corp Double Agent"
  lore: >
    Blaze is a Canadian-born Militech-employee-turned-arsonist and undercover spy for the Zoners.
    After graduating from a prestigious Canadian university, he was quickly recruited by Militech
    into R&D and rapidly ascended through the ranks before a demotion sent him spiraling. We don't
    know if this changed Blaze's motivations regarding Corps or if his participation in the Zoner
