  name: ""
  handle: "Vanisher"
  description: "Mysterious Zoner Ally"
  lore: >
    Vanisher's identity, gender, political affiliations, and funding are all unknown. Vanisher
    is a Solo who's been operating out of Night City for the last five years, previously reported
