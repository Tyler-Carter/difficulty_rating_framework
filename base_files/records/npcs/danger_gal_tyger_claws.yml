  $base: NPC.Base_Boss
  name: ""
  handle: "Zen"
  description: "Protector on the Rooftops"
  lore: >
    Where there's light, there's shadow. Zen knows the rooftops of the territory well, lurking
    always nearby and providing covert sniper support to the gang's senior members. He never takes
