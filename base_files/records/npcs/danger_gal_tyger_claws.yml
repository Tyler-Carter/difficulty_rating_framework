NPC.TygerClaws_Hamada:
  $base: NPC.Base_GangElite
  name: "Kouichi Hamada"
  handle: "Hamada"
  description: "Boss of the Street Vendors"
  lore: >
    Kouichi Hamada acts as the boss of the Tekiya (street vendors) in Kabuki for the Tyger Claws.
    An older member of the gang, he learned classic Japanese street food recipes in the early 2020s
    and has generously taught a number of apprentices, creating a thriving Day Market culture in
    Kabuki. Hamada never compromises or cheats — a devout Buddhist who makes regular pilgrimages.
