NPC.TygerClaws_ShinobuTheSecond:
  $base: NPC.Base_Boss
  name: "Hayato Nakagawa"
  handle: "Shinobu the Second"
  description: "Leader of the Tyger Claws"
  lore: >
    Hayato Nakagawa was adopted by Shinobu Nakagawa after the death of his parents. He wanted to
    be a Kabuki actor, but did not have the talent to succeed. He modeled his persona on the
    "Kabuki-mono," Japanese Rockerboy samurai of the 16th century. With his polished chrome body
    and flashy costume, he treats The Street as his theater and his regular parades have made him
    a hero to the youth of Kabuki.
  npcType: RecurringNPC
  faction: Tyger_Claws
  attitudeGroup: Hostile

  attributes:
    intelligence: 6
    reflexes:     8
    dexterity:    8
    tech:         7
    cool:         8
    willpower:    7
    luck:         7
    move:         7
    body:         12
    empathy:      2

  derivedStats:
