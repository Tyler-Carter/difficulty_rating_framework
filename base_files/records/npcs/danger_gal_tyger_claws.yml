NPC.TygerClaws_Burai:
  $base: NPC.Base_GangElite
  name: "Takeru Akagi"
  handle: "Burai"
  description: "Kimen-Gumi Leader"
  lore: >
    Takeru Akagi, aka Burai, serves as the captain of Kimen-Gumi, the "police" arm of the Tyger
    Claws. Burai wears a red mask and each of his lieutenants wears a unique mask of a different
    color, leading some residents of Kabuki to refer to the Kimen-Gumi leadership as the "Kabuki
    Rangers." Unlike Shinobu the Second, Burai is not a showy performer, but a steady and reliable
    combatant and commander.
