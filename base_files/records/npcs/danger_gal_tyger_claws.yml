NPC.TygerClaws_Wakako:
  $base: NPC.Base_GangElite
  name: "Wakako Okada"
  handle: "Wakako"
  description: "Reluctant Confidant"
  lore: >
    Wakako Okada was born in the Kansai region of Japan and came to Night City University to
    study practical clinical medicine. She met her husband Hiroto Miyamoto there, then found
    work as a laboratory Medtech at Kiroshi. When enemies of Hayato Nakagawa attacked Wakako
    and Hiroto at home, only Wakako survived — and Shinobu the Second promised her protection
    in exchange for her loyalty and counsel.
