  handle: "Shinmai"
  description: "New Rice"
  lore: >
    Shinkichi Yoneda is a teenager who moved from Old Japantown to Kabuki thanks to the sponsorship
    of the Tyger Claws. He showed promise in the Tyger Dojo and was recruited based on his skill
