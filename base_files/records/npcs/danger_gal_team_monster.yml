NPC.TeamMonster_Cereal:
  $base: NPC.Base_Elite
  name: ""
  handle: "Cereal"
  description: "Hack Night City!"
  lore: >
    Sometimes terror doesn't come from knowing what an opponent will do — sometimes it comes from
    not knowing what they'll do next. Cereal is "all out of bubble gum," and for someone who
    repeatedly says he doesn't want to resort to violence, it sure seems like he wakes up choosing
    it. He began with minor pranks escalating to full-on corporate data-hacking.
  npcType: RecurringNPC
  faction: Team_Monster
  attitudeGroup: Neutral

  attributes:
    intelligence: 7
    reflexes:     6
