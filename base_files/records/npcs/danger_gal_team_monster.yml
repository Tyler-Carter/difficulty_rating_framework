  name: ""
  handle: "Isolate"
  description: "No Longer a Red Shirt"
  lore: >
    Isolate grew up in Georgia, son to a legendary freedom fighter. SovOil drove his family off
    their land and into a burgeoning insurgent movement. Growing up in constant warfare, Isolate
    honed his weapon and combat skills to a razor's edge, establishing a deadly reputation as an
    elite sniper before decamping to Night City after his father's insurgent cell fell.
