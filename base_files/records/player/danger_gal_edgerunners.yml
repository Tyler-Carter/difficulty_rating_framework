# ---------------------------------------------------------------------------
NPC.Edgerunners_Tetsuo:
  $base: NPC.Base_Boss
  name: "Ryu Sakai"
  handle: "Tetsuo"
  description: "Great with a Knife — elite Solo and celebrity chef with a hidden past."
  lore: >
    Night City's hottest traditional Japanese restaurant Daiseikō has more on
    the menu than sushi. Head chef "Ryu Sakai" didn't exist before the restaurant
    opened — his data trail was retroactively inserted into the right databases.
    Tetsuo disappeared from the Japanese Edgerunner scene with a substantial
    score stolen from the Yakuza in Chiba prefecture.
  npcType: RecurringNPC
