  - LinguisticsBase          # your native language at INT+4 automatically
  - MakeFist                 # wilderness survival / foraging
  - Paramedic
  - PerceptionINT            # used separately from REF-based Perception in some editions
  - Science
  - Tactics
  - TechBase                 # general tech knowledge
  - WildernessSurvival

  # REF-based
  - Athletics
  - Brawling
  - Contortionist            # physical flexibility and acrobatic contortion
  - DriveLandVehicle
  - EducationREF             # placeholder; see Education (INT)
  - Evasion
  - Initiative
  - MartialArts
  - MeleeCombat
  - Perception               # awareness, spot hidden
  - Pilot_AerialVehicle
  - Pilot_SeaVehicle
  - RidingHorse
  - Stealth
  - Tracking

  # DEX-based
  - Acrobatics
  - Archery
  - ConcealRevealObject       # concealing/revealing items on person or in environment
  - Handgun
  - HeavyWeapons
  - ShoulderArms
  - Autofire
  - Dodge
  - SleightOfHand

  # TECH-based
  - AirVehicleTech
  - BasicTech
  - Cybertech
  - Demolitions
  - Electronics_SecurityTech
  - FirstAid
  - LandVehicleTech
  - MedicalTech               # pharmaceutical / surgical tech knowledge (Medtech role)
  - PaintDraw
  - Photography_Film          # capturing and editing photographic or video media
  - PickLock
  - PickPocket
  - SeaVehicleTech
  - Surgery                   # surgical procedures; distinct from Paramedic field medicine
  - Weaponstech

  # COOL-based
  - Bribery
  - ConversationCool          # social grace
  - HumanPerception
  - Interrogation
  - Intimidation
  - Persuasion
  - PersonalGrooming
  - Streetwise
  - Trading
  - WardrobeStyle

  # WILL-based
  - Concentration
  - ConversationWILL          # willpower-based persuasion (resist, maintain composure)
