  - EnduranceSTR

  # EMP-based
  - Acting
  - Dancing
  - Forgery
  - LibrarySearchEMP          # social research (rumour gathering)
  - Performance
  - PlayInstrument
  - SeductionEMP
  - SocialEMP
  - Wardrobe_EMP


# =============================================================================
# CULTURAL ORIGIN
# =============================================================================

CulturalOrigin:
  # RED Core Rulebook p. 72
  # Purely narrative usage there are no penalties associated with these.
  - NorthAmerican
  - SouthCentralAmerican
  - WesternEuropean
  - EasternEuropean
  - MiddleEasternNorthAfrican
  - SubSaharanAfrican
  - SouthAsian
  - SouthEastAsian
  - EastAsian
  - Oceanian
  - Nomad_American            # Nomads have their own regional sub-origin
  - Nomad_European
  - Nomad_Asian


# =============================================================================
# NPC CLASSIFICATION
# =============================================================================

NPCType:
  # High-level category for how an NPC was created / will be used.
  - EncounterNPC              # built for a specific combat or scene; single-use
  - RecurringNPC              # named, reappears across sessions
  - Vendor                    # shop or black market contact
  - QuestGiver                # provides hooks or missions
  - ContactFixer              # fixer-type relationship NPC

NPCRole:
  # Tactical role within an encounter.  Governs prototype selection.
  - Grunt                     # standard combatant; limited skills
  - Elite                     # more capable; may have cyberware
  - Sniper                    # ranged specialist; high Perception + ShoulderArms
  - Assassin                  # stealth and infiltration specialist; high Perception + Stealth
  - Rockerboy_NPC             # Edgerunner faction Charismatic Impact (social/crowd control)
  - Solo_NPC                  # Edgerunner faction Combat Awareness (initiative, perception)
  - Netrunner_NPC             # Edgerunner faction hacking NPC; may deploy ICE nodes
  - Tech_NPC                  # Edgerunner faction tech fabrication and repair)
  - Medtech_NPC               # Edgerunner faction healer/support; revives downed allies
  - Media_NPC                 # Edgerunner faction investigations and broadcasting
  - Lawman_NPC                # Edgerunner faction Law enforcement
  - Exec_NPC                  # Edgerunner faction Team buffs and corporate resources
  - Fixer_NPC                 # Edgerunner faction contacts network, gig provider, resource acquisitions
  - Nomad_NPC                 # Edgerunner faction Vehicle mastery and travel skills
  - Boss                      # major named threat; highest stats
  - NamedNPC                  # story-critical; not necessarily combat-focused
  - Bodyguard                 # protecting a principal; attitudeGroup usually Hostile to threats
  - Driver                    # vehicle operator; not primarily a combatant

NPCRarity:
  # Encounter difficulty label.  Used by GMs to gauge challenge quickly.
  # Standard tiers (Danger Gal Dossier p.150):
  - Mook                      # barely trained; dies from one good hit (HP 20–30)
  - Normal                    # street-level threat; typical gang member
  - Tough                     # seasoned; cyberware likely (HP 50–80)
  - Elite                     # specialist; notable skills and gear
  - Boss                      # encounter anchor; built to survive multiple rounds
  # Hardened tiers (Danger Gal Dossier p.152) — use when facing a combat-optimised Crew:
  - HardenedMook              # +6 STAT budget (max STAT 7); +500eb Cyberware; may have Role Ability Rank 2
  - HardenedLieutenant        # +4 STAT budget (max STAT 8); +500eb Cyberware; likely has Role Ability Rank 4
  - HardenedMiniBoss          # +2 STAT budget (max STAT 8); +1,200eb Cyberware; may have Role Ability Rank 6
  - HardenedBoss              # +5 STAT budget; unlimited Cyberware (likely cyberpsycho); may have Role Ability Rank 8


