    - Trauma_Team
  MegaCorporations:
    - Arasaka
    - Militech
    - Kang_Tao
    - Biotechnica
    - PetraChemical
    - SovOil
    - Orbital_Air
    - EuroBank
  NightCityGangs:
    # Tagged NightCity for future multi-city extensibility
    - 6th_Street
    - Animals
    - Aldecaldos
    - Barghest
    - Bozos
    - Generation_Red
    - Maelstrom
    - Moxes
    - Piranhas
    - Sightseers
    - Team_Monster
    - Tyger_Claws
    - Valentinos
    - Voodoo_Boys
    - Wraiths
    - Scavengers
    - Zoners
  Independent:
