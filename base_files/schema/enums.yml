    - Digital_Divas           # media/influencer crew
    - Network_54              # broadcast media network
    - Edgerunner              # unaffiliated mercenary team


# =============================================================================
# CYBERWARE
# =============================================================================

CyberwareSlot:
  # Body installation slots. RED pp. 228-263.
  - Neuralware               # Neural Link required for most Neuralware
  - Cyberoptics              # eye replacements/augments
  - Cyberaudio               # ear augments
  - CyberArm_Right
  - CyberArm_Left
  - CyberLeg_Right
  - CyberLeg_Left
  - BodyPlating              # external or subdermal armor plating
  - Internal_Organs          # borgware, internal mods
  - Fashionware              # cosmetic; no humanity cost
  - Borgware                 # full limb/chassis replacement; high humanity cost

CyberwareType:
  - Passive                  # always-on stat modifier
  - Active                   # triggered by player (uses an action)
  - NeuralOS                 # operating system tier (Sandevistan, Berserk, Interface Plugs)
  - WeaponCyber              # body-mounted weapon (Mantis Blades, Monowire, Gorilla Arms)
  - Fashionware              # aesthetic only; no mechanical effect


# =============================================================================
# ARMOR
# =============================================================================

ArmorType:
  # RED Core Rulebook pp. 228-230
  - Leathers                 # SP 4;  light; concealable
  - KevlarVest               # SP 7;  standard; concealable under heavy clothing
  - LightArmorJacket         # SP 11; medium
  - BodyweightSuit           # SP 11; medium; concealable
  - MediumArmorJacket        # SP 15; heavy
  - HeavyArmorJacket         # SP 18; very heavy; REF penalty
  - FlakVest                 # SP 15; military
  - MetalGearHeavy           # SP 18; military; major REF penalty
  - LinedCoat                # SP 12; medium; fashionable
  - Shield                   # held; SP 10 for the arm side


# =============================================================================
# EQUIPMENT / ITEMS
# =============================================================================

ItemType:
  - MedicalSupply            # Trauma Packs, Stims, pharmaceuticals
  - NetrunnerTool            # Cyberdeck components, Programs
  - Explosive                # Grenades, mines, breaching charges
  - CommunicationDevice      # Agents, radio jammers
  - ToolsEquipment           # Mechanical tools, lockpicks, cameras
  - FashionCosmetic          # Clothing with no armor value
  - Consumable               # Single-use items not covered above
  - MiscGear                 # Everything else


# =============================================================================
# ABILITIES
# =============================================================================

AbilityTrigger:
  - OnEquip                  # activates when item is equipped
  - OnAttack                 # triggers on attack action
  - OnHit                    # triggers when attack connects
  - OnKill                   # triggers on defeating an enemy
  - OnActivate               # player-triggered active use
  - OnHack                   # Netrunner quickhack trigger
  - Passive                  # always active while equipped / installed
  - OnRoundStart             # triggers at the start of each combat round
  - OnTakeDamage             # triggers when the character takes damage


# =============================================================================
# ATTITUDE / ENCOUNTER STANCE
# =============================================================================

AttitudeGroup:
  # GM encounter-facing stance.  Drives initial NPC behaviour in a scene.
  - Friendly
  - Neutral
  - Suspicious
  - Hostile
  - Fearful
  - Berserk                  # will not stop fighting; ignores morale


# =============================================================================
# EQUIPMENT HAND
# =============================================================================

EquipHand:
  - Primary                  # dominant hand
  - Offhand                  # non-dominant; -2 to attack rolls without Ambidextrous
  - TwoHanded                # requires both hands; fills both slots
  - Holstered                # stowed; costs an action to draw


# =============================================================================
# NETWORK (HACKING) SYSTEM
# =============================================================================

NodeType:
  # Standard infrastructure nodes (depth 1–2)
  - Camera
  - Door
  - Light
  - Speaker
  - Terminal
  - PowerGrid
  - Elevator
  - VehicleControl
  - Turret
  # Special
  - CyberwareNode            # targets NPC's installed cyberware
  # ICE types (intrusion countermeasure electronics)
  - ICE_Watchdog             # passive: alerts on detection, does not attack
  - ICE_Hellhound            # active: drains Momentum each round
  - ICE_Kraken               # deep: drains Momentum AND triggers rapid response

NodeState:
  - Active
  - Compromised
  - Flatlined

QuickhackTarget:
  - Node
  - NPC
  - ICE
  - Any


# =============================================================================
# STATUS EFFECTS
# =============================================================================

StatusEffectType:
  # Common RED conditions applied by weapons, cyberware, or abilities.
  - Stunned                  # loses next action
  - Burning                  # takes Thermal tick damage each round
  - Poisoned                 # takes Chemical tick damage; BODY resist
  - EMPed                    # cyberware disabled for duration
  - Suppressed               # pinned; must spend action to move
  - Blinded                  # -4 to all attack and perception rolls
  - Bleeding                 # loses HP at end of each round; First Aid or Trauma Pack ends
