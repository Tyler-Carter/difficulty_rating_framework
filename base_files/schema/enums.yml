# =============================================================================
# schema/enums.yml
# Valid enumerated values for all record types.
# The resolver validates every field marked { type: enum } against this file.
#
# Game system: Cyberpunk RED Core Rulebook (R. Talsorian Games, 2020)
# =============================================================================


# =============================================================================
# WEAPONS
# =============================================================================

WeaponType:
  # RED Core Rulebook pp. 340-351
  ranged:
    - Pistol                # includes light pistols
    - HeavyPistol
    - VeryHeavyPistol
    - SMG                   # submachinegun
    - HeavySMG
    - Shotgun
    - AssaultRifle
    - SniperRifle
    - GrenadeLauncher
    - RocketLauncher
    - HeavyMachineGun
    - Bow                   # crossbows use the same profile
    - FlamethrowerWeapon
  melee:
    - LightMelee            # light blades, small knives; one-handed, concealable
    - MediumMelee           # knives, hatchets, most one-handed blades
    - HeavyMelee            # two-handed or over-sized (sledge, axe)
    - VeryHeavyMelee        # chainsaw, monoblade; requires two hands
    - Brawling              # unarmed / martial arts
    - CyberweaponMelee      # Mantis Blades, Monowire — attached to body
  thrown:
    - Grenade
    - Knife                 # throwable knives use a separate range profile

WeaponCategory:
  # Technology classification
  - Standard
  - Military                # restricted; +1d6 damage in some house rules
  - Exotic                  # unusual; GM adjudicates legality
  - Melee

DamageType:
  - Physical
  - Thermal                 # fire-based; triggers Burning status
  - Chemical                # poison/acid; triggers Poison status
  - Electric                # EMP-adjacent; triggers Stunned on crit
  - EMP                     # disables electronics and cyberware on hit


# =============================================================================
# RARITY / QUALITY
# =============================================================================

Rarity:
  # Used for weapons, cyberware, and items.
  # Maps loosely to RED quality tiers for crafted items (p. 140).
  - Poor
  - Standard
  - Excellent
  - Iconic                  # GMs can create speciality items as high-value rewards


# =============================================================================
# STAT MODIFIERS
# =============================================================================

ModifierType:
  - Additive                # flat value added to base
  - Multiplier              # scales existing value
  - Override                # replaces base value entirely


# =============================================================================
# ROLES
# =============================================================================

Role:
  # The ten playable Roles from RED Core Rulebook pp. 96-213.
  # Each Role provides exactly one special ability that scales rank 1–10.
  - Rockerboy               # Charismatic Impact (social/crowd control)
  - Solo                    # Combat Awareness (initiative, perception)
  - Netrunner               # Interface (hacking, netrunning)
  - Tech                    # Maker (fabrication, repair)
  - Medtech                 # Medicine (field surgery, pharmaceuticals)
  - Media                   # Credibility (investigation, broadcasting)
  - Lawman                  # Backup (law enforcement, backup calls)
  - Exec                    # Teamwork (team buffs, corporate resources)
  - Fixer                   # Operator (contact network, resource acquisition)
  - Nomad                   # Moto (vehicle mastery, travel skills)


